name: upstream-watch

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check chromiumdash for a newer stable
        id: check
        run: |
          set +e
          out=$(python3 scripts/check_upstream.py --json)
          code=$?
          echo "$out"
          echo "payload=$out" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != "0" ] && [ "$code" != "10" ]; then exit 1; fi

      - name: Open or update the upgrade issue
        if: steps.check.outputs.code == '10'
        uses: actions/github-script@v7
        with:
          script: |
            const payload = JSON.parse(${{ toJSON(steps.check.outputs.payload) }});
            const title = `Chromium ${payload.latest} released (current pin: ${payload.current})`;
            const body = [
              `chromiumdash reports **${payload.latest}** (M${payload.milestone}) on the Stable channel.`,
              `Current pin: \`${payload.current}\`.`,
              '',
              'Local upgrade runbook: `docs/UPGRADE.md`',
              '',
              '_Opened automatically by the upstream-watch workflow._',
            ].join('\n');
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const existing = issues.find(i => i.title.startsWith('Chromium ') && i.title.includes('released'));
            if (existing) {
              if (existing.title !== title) {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number, title, body,
                });
              }
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body,
              });
            }
